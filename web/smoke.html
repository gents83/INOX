<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INOX WebGPU smoke test</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <canvas id="canvas" width="640" height="360"></canvas>
    <div id="status" role="status" data-inox-smoke="pending">Starting</div>
    <script type="module">
        import init from './inox_launcher.js';

        const status = document.getElementById('status');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('webgpu');
        if (!context) {
            status.dataset.inoxSmoke = 'failed';
            status.textContent = 'WebGPU surface unavailable';
        } else {
            init().then(() => {
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        status.dataset.inoxSmoke = 'passed';
                        status.textContent = 'WebGPU frame observed';
                    });
                });
            }).catch((error) => {
                status.dataset.inoxSmoke = 'failed';
                status.textContent = String(error);
                console.error(error);
            });
        }
    </script>
</body>
</html>
