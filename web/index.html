<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INOX WebGPU</title>
    <style>
        html,
        body {
            margin: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <p>Examples:</p>
    <ul>
        <li>
            <a href="empty.html">Empty scene</a>
        </li>
        <li>
            <a href="test.html">Simple 3D scene loaded from file</a>
        </li>
        <li>
            <a href="webgl.html">WebGL usage</a>
        </li>
        <li>
            <a href="test_canvas.html">Canvas info test</a>
        </li>
    </ul>
    <div id="status" role="status"></div>
    <canvas id="canvas" width="1" height="1" tabindex="0"></canvas>
    <script type="module">
        const status = document.getElementById('status');
        const is_wgpu_enabled = 'gpu' in navigator;
        status.textContent = is_wgpu_enabled
            ? 'WebGPU available'
            : 'WebGPU is not available. Enable WebGPU in a supported browser.';
    </script>
</body>

</html>
